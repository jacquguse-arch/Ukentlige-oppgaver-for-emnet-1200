<!DOCTYPE html>
<html lang="en">
    <head>
    <meta charset = "UTF-8">
        <meta name="viewpoint" content = "width= device-width, initial-scale=1.0">
            <title>Employees and wages</title>


    <style>
        table {
            border-collapse:collapse;
            width: 70%;
        }
        th,
        td{
            border: 1px solid black;
            padding: 15px;
            text-align: left;
        }
        caption{
            font-size:24px;
            font-weight:bold;
            margin-bottom: 10px;
        }
        thead{
            background-color: rgb(106, 143, 224)
        }
        tbody tr:nth-child(even) {
        background-color: rgb(95, 170, 235);
        }
    </style>
    </head>
            <body>
                <table>
                    <caption>Employees and wages</caption>
                        <thead>
                            <tr>
                                 <th scope="col">Name</th>
                                 <th scope="col">Position</th>
                                 <th scope="col">Wage</th>
                             </tr>
                         </thead>
                    <tbody>

                            <tr>
                                <td scope="row">John Smith</td>
                                <td>Sales Associate</td>
                                <td>$15.50 per hour</td>
                            </tr>

                            <tr>
                               <td scope="row">Emma Johnson</td>
                               <td>Customer Service Representative</td>
                               <td>$14.75 per hour</td>
                           </tr>

                           <tr>
                                <td scope="row">Michael Brown</td>
                                <td>Marketing Coordinator</td>
                                <td>$18.25 per hour</td>
                           </tr>

                           <tr>
                                <td scope="row">Sarah Davis</td>
                                <td>IT Support Specialist</td>
                                <td>$20.00 per hour</td>
                           </tr>

                           <tr>
                                <td scope="row">David Wilson</td>
                                <td>Administrative Assistant</td>
                                <td>$16.80 per hour</td>
                           </tr>
                  </tbody>
             </table>
</html>
